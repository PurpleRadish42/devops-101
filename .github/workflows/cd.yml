# CD = Continuous Delivery: every merge to main is built, pushed and deployed.
name: CD

on:
  push:
    branches: [main] # runs when a PR is merged (or someone pushes to main)
  workflow_dispatch:

jobs:
  # 1. Build both Docker images and push them to GitHub Container Registry (ghcr.io)
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # allow GITHUB_TOKEN to push images
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # built-in token, no setup needed
      - uses: docker/setup-buildx-action@v4

      - name: Build & push frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: | # the commit SHA = exact version; latest = newest
            ghcr.io/purpleradish42/devops-101-frontend:${{ github.sha }}
            ghcr.io/purpleradish42/devops-101-frontend:latest
          cache-from: type=gha,scope=frontend # layer cache -> fast rebuilds
          cache-to: type=gha,scope=frontend,mode=max

      - name: Build & push backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/purpleradish42/devops-101-backend:${{ github.sha }}
            ghcr.io/purpleradish42/devops-101-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  # 2. Deploy to staging automatically
  deploy-staging:
    needs: build-and-push # waits for the job above to succeed
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: cd /opt/devops-101 && ./deploy/deploy.sh staging ${{ github.sha }}

  # 3. Deploy to production - pauses until a reviewer clicks "Approve"
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production # required reviewer is set on this environment in GitHub settings
    steps:
      - name: Deploy to production over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: cd /opt/devops-101 && ./deploy/deploy.sh production ${{ github.sha }}
